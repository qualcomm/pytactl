[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytactl"
dynamic = ["version"]
description = "Python Test Automation Controller (TAC/Alpaca) for Qualcomm debug boards"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Qualcomm Technologies, Inc.", email = "qc.opensource@qti.qualcomm.com" },
]
maintainers = [
    { name = "Milosz Wasilewski", email = "milosz.wasilewski@oss.qualcomm.com" },
]
keywords = [
    "debug-board",
    "hardware",
    "qualcomm",
    "tac",
    "test-automation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
]
dependencies = [
    "Flask",
    "flask-restx",
    "pyftdi",
    "pyusb",
    "pexpect",
    "pyserial",
    "requests",
    "platformdirs",
    "hid",
]

[project.optional-dependencies]
dev = ["ruff==0.15.17", "pytest"]

[project.scripts]
pytactl = "pytactl.cli:main"

[project.urls]
Homepage = "https://github.com/qualcomm/pytactl"
Repository = "https://github.com/qualcomm/pytactl"
Issues = "https://github.com/qualcomm/pytactl/issues"
Documentation = "https://github.com/qualcomm/pytactl/blob/main/README.md"
Changelog = "https://github.com/qualcomm/pytactl/blob/main/CHANGELOG.md"
"Security Policy" = "https://github.com/qualcomm/pytactl/blob/main/SECURITY.md"

[tool.setuptools]
packages = ["pytactl"]

# Single source of truth for the version: pytactl/__init__.py
[tool.setuptools.dynamic]
version = { attr = "pytactl.__version__" }

[tool.setuptools.package-data]
pytactl = ["tac_configs/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Ruff configuration (replaces black, isort and pylint)
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import ordering)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B904",    # raise-without-from inside except (matches old pylint W0707)
    "SIM115",  # open without a context manager (matches old pylint R1732)
]
