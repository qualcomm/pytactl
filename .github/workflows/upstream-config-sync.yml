# Compares the TAC configs vendored in pytactl/tac_configs/ with the upstream
# qcom-test-automation-controller repository, converted to the shared pinout
# format, and proposes a pull request when upstream has changed.
#
# Differences listed in scripts/known-config-differences.json are upstream
# changes deliberately not taken; they do not trigger a pull request for as long
# as upstream still matches the fingerprint recorded for them. Everything else
# that differs is applied file by file (see scripts/sync_upstream_configs.py).
# Upstream changes for BugHopper V1 and V2 boards, configs and catalog entries
# alike, are never taken.
#
# When the test suite fails against the synced configs the pull request is
# still proposed, as a draft with the failing tests listed, and the run fails.
#
# The pull request is opened from a fixed branch, so a later run with further
# upstream changes updates the open one instead of opening another.
name: Upstream config sync

on:
  workflow_dispatch:
  schedule:
    # Weekly, on Mondays.
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-config-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pytactl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential: the pull request
          # is created by create-pull-request, which unsets whatever checkout
          # persisted and configures its own from its "token" input.
          persist-credentials: false

      - name: Check out qcom-test-automation-controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qualcomm/qcom-test-automation-controller
          path: upstream
          # Read-only clone of a public repository, and it is deleted again
          # before the pull request is built.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pytactl
        run: |
          python -m pip install --upgrade pip
          # Editable, so the tests below load the synced configs from the tree.
          pip install -e .[dev]

      - name: Compare and apply new upstream differences
        id: sync
        run: |
          python scripts/sync_upstream_configs.py upstream --apply \
            --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "commit=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          # The upstream checkout is not part of the change.
          rm -rf upstream

      # A failure does not stop the pull request: the changes still need a
      # reviewer to decide what to take. The failure is reported in it instead.
      - name: Run the test suite against the synced configs
        id: tests
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain -- pytactl/tac_configs scripts/known-config-differences.json)" ]; then
            echo "No changes; skipping."
            exit 0
          fi
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      - name: Report test failures in the pull request
        if: steps.tests.outcome == 'failure'
        run: |
          {
            echo
            echo "## Warning: the test suite fails against these configs"
            echo
            echo "This pull request is opened as a draft until that is resolved."
            echo
            echo '```'
            sed -n '/short test summary info/,$p' "$RUNNER_TEMP/pytest.log"
            echo '```'
          } >> "$RUNNER_TEMP/summary.md"

      - name: Propose a pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          # Pull requests opened with the default GITHUB_TOKEN do not trigger
          # other workflows; set CONFIG_SYNC_TOKEN to a PAT for CI to run on them.
          token: ${{ secrets.CONFIG_SYNC_TOKEN || github.token }}
          branch: upstream-config-sync
          delete-branch: true
          title: "Sync TAC configs with upstream ${{ steps.sync.outputs.commit }}"
          commit-message: |
            Sync TAC configs with upstream ${{ steps.sync.outputs.commit }}

            Apply the upstream qcom-test-automation-controller config changes
            not listed in scripts/known-config-differences.json.
          signoff: true
          draft: ${{ steps.tests.outcome == 'failure' }}
          body-path: ${{ runner.temp }}/summary.md
          add-paths: |
            pytactl/tac_configs
            scripts/known-config-differences.json

      # Keep the run red when the suite failed, after the pull request is up.
      - name: Fail when the test suite failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::The test suite fails against the synced configs."
          exit 1
