name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"
    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - name: Check the version matches the tag
      if: github.ref_type == 'tag'
      env:
        TAG: ${{ github.ref_name }}
      run: |
        VERSION=$(python -c 'import ast, sys; t = ast.parse(open("pytactl/__init__.py").read()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and n.targets[0].id == "__version__"))')
        if [ "${TAG#v}" != "$VERSION" ] && [ "${TAG#v}.0" != "$VERSION" ]; then
          echo "::error::Tag $TAG does not match pytactl.__version__ $VERSION; bump the version before tagging."
          exit 1
        fi
    - name: Build sdist and wheel
      run: python -m build
    - name: Check distributions
      run: twine check --strict dist/*
    - name: Upload distributions
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Uses PyPI Trusted Publishing (OIDC); no API token secret is required.
    # Configure the publisher for this repository and workflow at
    # https://pypi.org/manage/project/pytactl/settings/publishing/
    environment:
      name: pypi
      url: https://pypi.org/p/pytactl
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Download distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/
    - name: Publish
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
